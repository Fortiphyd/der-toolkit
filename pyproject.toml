[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "der-toolkit"
version = "0.1.0"
description = "Attack-surface mapping and protocol fuzzing for DER protocols (DNP3, SunSpec Modbus, IEEE 2030.5), with an MCP server for AI-assisted assessment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Fortiphyd Logic" }]
keywords = ["DER", "DNP3", "SunSpec", "Modbus", "IEEE 2030.5", "fuzzing", "ICS", "MCP"]

# Core deps shared by the mappers. Protocol- and MCP-specific heavy deps are
# pulled in via the optional groups below so a user who only wants read-only
# mapping doesn't have to install boofuzz.
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
sunspec = ["pymodbus>=3", "boofuzz>=0.4"]
sep2    = ["cryptography>=42", "zeroconf>=0.130", "httpx>=0.27"]
dnp3    = ["boofuzz>=0.4"]
mcp     = ["mcp>=1.2"]
all     = ["pymodbus>=3", "cryptography>=42", "zeroconf>=0.130", "httpx>=0.27", "boofuzz>=0.4", "mcp>=1.2"]
dev     = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
der-dnp3    = "der_dnp3.cli:main"
der-sunspec = "der_sunspec.cli:main"
der-sep2    = "der_sep2.cli:main"
der-mcp     = "der_mcp.server:main"
der-report  = "der_common.report:main"

[tool.hatch.build.targets.wheel]
packages = ["der_common", "der_dnp3", "der_sunspec", "der_sep2", "der_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: spins up real subprocess servers/CLI commands (slower, excluded by default in CI's fast job)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness (F) + import hygiene (I) + syntax errors (E9) + a couple of
# pycodestyle/pyupgrade rules worth keeping (E4/E7 style, UP modernization).
# Deliberately excludes opinionated/noisy categories (BLE, S, SIM, PLW, RUF, ...)
# that don't fit this codebase's defensive-network-code style (e.g. broad
# except Exception around fuzzing/parsing is often intentional here).
select = ["E4", "E7", "E9", "F", "I", "UP"]
