# SEP2 demo device: VULNERABLE posture, with two distinct findings on purpose:
#
#   1. An access-control misconfiguration: the registration-gated DER control
#      surface is force-opened via open_resources below, while TLS/mTLS/chain
#      validation stay correctly enforced -- showing that one misconfigured
#      setting is enough to expose the control surface on its own. (A
#      validate_cert_chain=false / leaked-cert variant of this would be more
#      direct, but that mode in ssl_server.py doesn't actually work -- see
#      demo/README.md.)
#   2. A real XML implementation bug: XXE is enabled, exploitable against the
#      EndDevice/lFDI and Subscription/subscribedResource fields (see
#      der_sep2/fuzzing/xml_payloads.py).

server:
  host: "127.0.30.2"
  port: 15388
  log_level: "INFO"

tls:
  cert_file: "certs/server.crt"
  key_file:  "certs/server.key"
  ca_file:   "certs/ca.crt"
  enforce_mtls: true
  validate_cert_chain: true
  minimum_tls_version: "TLS1_0"

acl:
  registered_lfdis:
    - "REGISTERED_LFDI_PLACEHOLDER"
  enforce_registration: true

vulnerability:
  open_resources:
    - "/edev/{id}/der"          # <-- the access-control flaw: DER control surface force-opened
  allow_xxe: true                # <-- the implementation flaw
  allow_billion_laughs: false

mdns:
  enabled: true
  service_name: "sep2-vulnerable-demo"
